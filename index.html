<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>SpeciesNYC</title>
  <meta name="description" content="Javascript Class">
  <meta name="author" content="Lara Washington">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="map_wrap">
    <div id="nyc_map"></div>
    <div class="radius_control">
      <label for="radius_slider">Radius <span id="radius_value">500 m</span></label>
      <input type="range" id="radius_slider" min="500" max="5000" step="250" value="500">
    </div>
  </div>
  <p class="status" id="status" hidden></p>
  <section class="panel">
    <h2>Most Observed</h2>
    <div class="species_list" id="common_list"></div>
  </section>
  <section class="panel">
    <h2>Most Distinctive</h2>
    <div class="species_list" id="distinctive_list"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="script.js" defer></script>
</body>

</html>
