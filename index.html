<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>SpeciesNYC</title>
  <meta name="description" content="Javascript Class">
  <meta name="author" content="Lara Washington">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="nyc_map"></div>
  <div class="radius_control">
    <label for="radius_slider">Radius <span id="radius_value">500 m</span></label>
    <input type="range" id="radius_slider" min="500" max="5000" step="250" value="500">
  </div>

  <!-- species panel: hidden until the first click, slides in from the right -->
  <aside class="panel" id="panel">
    <button class="panel_close" id="panel_close" type="button" aria-label="Close panel">&times;</button>
    <p class="status" id="status" hidden></p>
    <div class="panel_lists" id="panel_lists">
      <section class="panel_section">
        <h1>Most Observed</h1>
        <div class="species_list" id="common_list"></div>
      </section>
      <section class="panel_section">
        <h1>Most Distinctive</h1>
        <div class="species_list" id="distinctive_list"></div>
      </section>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="./utils/keys.0.js" defer></script>
  <script src="script.js" defer></script>
</body>

</html>
